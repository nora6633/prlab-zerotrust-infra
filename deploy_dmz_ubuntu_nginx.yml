---
# Installs nginx as a reverse proxy in front of Juice Shop on dmz-ubuntu,
# and wires its access log into the Wazuh agent — the Linux equivalent of
# the nginx_dmz_windows role. Run AFTER site.yml has deployed Docker,
# the Wazuh agent, and Juice Shop to dmz-ubuntu.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini deploy_dmz_ubuntu_nginx.yml

- name: Configure nginx reverse proxy + Wazuh log forwarding on dmz-ubuntu
  hosts: dmz-ubuntu
  become: true
  gather_facts: true

  vars:
    juice_shop_port: 3000

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Template nginx reverse-proxy config
      copy:
        dest: /etc/nginx/sites-available/juice-shop
        content: |
          server {
            listen 80;
            access_log /var/log/nginx/access.log combined;
            location / {
              proxy_pass http://127.0.0.1:{{ juice_shop_port }};
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
          }
        mode: '0644'
      notify: reload nginx

    - name: Enable juice-shop site, disable default
      file:
        src: /etc/nginx/sites-available/juice-shop
        dest: /etc/nginx/sites-enabled/juice-shop
        state: link
      notify: reload nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: reload nginx

    - name: Enable and start nginx
      systemd:
        name: nginx
        enabled: true
        state: started

    - name: Configure Wazuh agent to monitor nginx access log
      blockinfile:
        path: /var/ossec/etc/ossec.conf
        insertbefore: '</ossec_config>'
        marker: "  <!-- {mark}: nginx access log -->"
        block: |
              <localfile>
                <log_format>apache</log_format>
                <location>/var/log/nginx/access.log</location>
              </localfile>
      notify: restart wazuh-agent

    - name: Wait for Juice Shop port to be listening
      wait_for:
        port: "{{ juice_shop_port }}"
        timeout: 60

    - name: Install iptables (used by the ip-limit Active Response script)
      apt:
        name: iptables
        state: present

    - name: Ensure Wazuh agent Active Response bin directory exists
      file:
        path: /var/ossec/active-response/bin
        state: directory
        owner: root
        group: wazuh
        mode: '0750'

    - name: Deploy ip-limit Active Response script (Shuffle-triggered only, see ddos-plan.txt Part 3)
      copy:
        src: roles/wazuh_ddos_rules/files/active-response/ip-limit.sh
        dest: /var/ossec/active-response/bin/ip-limit.sh
        owner: root
        group: wazuh
        mode: '0750'
      notify: restart wazuh-agent

    # ip-limit.sh self-manages its own per-srcip auto-release timer instead
    # of relying on ar.conf's <timeout> (confirmed live: that native
    # mechanism does not reliably fire for an API-dispatched, not
    # rule-triggered, Active Response — same gap host-isolate.sh's own
    # backstop wodle already works around, see
    # roles/insider_threat_agent_linux/tasks/main.yml for the sibling
    # registration). This wodle is the backstop for the case the detached
    # sleeper itself dies (e.g. a wazuh-agent.service restart reaping it
    # via KillMode=control-group) — --check-expiry is a silent no-op unless
    # a deadline file exists AND has actually expired, so this 15s interval
    # doesn't spam active-responses.log.
    - name: Configure ip-limit auto-release backstop wodle (catches a dead setsid sleeper)
      blockinfile:
        path: /var/ossec/etc/ossec.conf
        insertbefore: '</ossec_config>'
        marker: "  <!-- {mark}: ip-limit block expiry wodle -->"
        block: |
              <wodle name="command">
                <disabled>no</disabled>
                <tag>ip-limit-expiry-check</tag>
                <command>/var/ossec/active-response/bin/ip-limit.sh --check-expiry</command>
                <interval>15s</interval>
                <ignore_output>yes</ignore_output>
                <run_on_start>yes</run_on_start>
                <timeout>10</timeout>
              </wodle>
      notify: restart wazuh-agent

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

    - name: restart wazuh-agent
      systemd:
        name: wazuh-agent
        state: restarted
