---
# ── Shuffle ────────────────────────────────────────────────────────────────
shuffle_admin_username: admin
shuffle_admin_password: "ShuffleAdm1n!"
# API key used by Ansible and Wazuh integration to authenticate with Shuffle
shuffle_default_apikey: "CHANGE_ME_shuffle_api_key_min_36_chars!!"
# Stable IDs for the pre-built IRIS workflow
shuffle_workflow_id: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
shuffle_webhook_trigger_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
# Stable IDs for the DDoS auto-response workflow
shuffle_ddos_workflow_id: "c3d4e5f6-a7b8-9012-cdef-012345678912"
shuffle_ddos_webhook_trigger_id: "b2c3d4e5-f6a7-8901-bcde-f01234567892"

# ── Wazuh API (used by DDoS workflow AUTO_BLOCK path to call
#    PUT /active-response — see wazuh_ddos_workflow.json.j2's wazuh_auth
#    and wazuh_ar_block_* nodes). Same credential the dashboard uses
#    (wazuh.yml.j2), not a separate account.
wazuh_api_user: "wazuh-wui"
wazuh_api_password: "MyS3cr37P450r.*-"

# ── DMZ agent IDs (used by wazuh_ar_block_windows/_linux to target the
#    right agent). Hardcoded here and rendered at Ansible template time
#    rather than read from $exec.agent.id at Shuffle runtime: verified live
#    that Shuffle's variable substitution unreliably resolves
#    $exec.agent.<field> on nodes reached via a conditional branch (it
#    returns the whole parent object instead of the leaf value on some
#    runs) — too risky for the field that decides which agent gets an
#    Active Response block. Update these if agent registration order
#    ever changes (check with `agent_control -l` on the manager).
dmz_windows_agent_id: "006"
dmz_ubuntu_agent_id: "007"

# ── AbuseIPDB (N3) ────────────────────────────────────────────────────────
# Get a free key at https://www.abuseipdb.com/account/api
abuseipdb_api_key: "CHANGE_ME_ABUSEIPDB_API_KEY"

# ── Wazuh indexer (N4 history query) ──────────────────────────────────────
wazuh_indexer_url: "https://{{ wazuh_server_ip }}:9200"
wazuh_indexer_user: "admin"
wazuh_indexer_password: "SecretPassword"

# ── SOC notification (N7b NOTIFY_SOC email) ───────────────────────────────
soc_notify_email: "soc@example.lab"

# ── DFIR-IRIS ──────────────────────────────────────────────────────────────
iris_version: "v2.4.18"
iris_admin_password: "IrisAdm1n!"
# Set this before running configure_integration.yml — used by Shuffle to call IRIS API
iris_adm_api_key: "CHANGE_ME_IRIS_ADM_API_KEY_36_CHARS_MIN"
iris_db_password: "irisDbP@ssw0rd"
iris_rabbitmq_user: iris
iris_rabbitmq_password: "irisRabbitP@ss1"
iris_secret_key: "iris-secret-key-change-me-at-least-32chars!!"

# ── Wazuh integration ──────────────────────────────────────────────────────
wazuh_alert_min_level: 7

# Host-side path of the file that the manager container's entrypoint copies into
# /var/ossec/etc/ossec.conf on every restart. Modifications to /var/ossec/etc/ossec.conf
# inside the container do NOT survive restarts — always inject into this path instead.
wazuh_manager_host_conf: "{{ deploy_base_dir }}/wazuh/wazuh-docker/single-node/config/wazuh_cluster/wazuh_manager.conf"
