services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      # Default is 2 cores / 4G RAM — confirmed live to be the actual DDoS
      # detection bottleneck on this agent: under flood load nginx and
      # wazuh-agent contend for the same 2 vCPUs, capping event-processing
      # throughput at a hard ceiling no Wazuh buffer/queue setting can move
      # (verified: 3 different buffer/EPS/read-interval tunings all produced
      # the identical ~21 correlated-hits/30s ceiling). Host has 24 cores
      # free, so give it real headroom.
      CPU_CORES: "4"
      RAM_SIZE: "8G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
      - 5985:5985/tcp
      - 3000:3000/tcp
      - 80:80/tcp
    volumes:
      - ./windows:/storage
    restart: always
    stop_grace_period: 2m
