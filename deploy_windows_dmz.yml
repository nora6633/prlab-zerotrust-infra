---
# Deploys OWASP Juice Shop + Wazuh Agent on a Windows DMZ host.
# Use this INSTEAD of the `external` play in site.yml when the external host is Windows.
#
# Prerequisites on the Windows target:
#   - WinRM enabled (Enable-PSRemoting -Force) and reachable on TCP/5985
#   - An admin user with credentials configured in inventory
#   - Internet access (for Chocolatey, Wazuh MSI, Juice Shop release zip)
#
# Required Ansible collections:
#   ansible-galaxy collection install ansible.windows community.windows chocolatey.chocolatey
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini deploy_windows_dmz.yml

- name: Deploy Windows DMZ - Juice Shop + Wazuh Agent
  hosts: external
  gather_facts: false

  vars:
    wazuh_manager_ip: "{{ wazuh_server_ip }}"
    agent_name: "dmz-windows"
    juice_shop_port: 3000
    juice_shop_version: "19.2.1"
    install_dir: 'C:\soc-infra'
    nginx_dir: 'C:\tools\nginx-1.31.2'

  tasks:
    - name: Create soc-infra directory
      ansible.windows.win_file:
        path: "{{ install_dir }}"
        state: directory

    - name: Install Chocolatey
      ansible.windows.win_shell: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
        Invoke-Expression ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      args:
        creates: 'C:\ProgramData\chocolatey\bin\choco.exe'

    - name: Install Node.js LTS
      chocolatey.chocolatey.win_chocolatey:
        name: nodejs-lts
        state: present

    - name: Install NSSM (service manager)
      chocolatey.chocolatey.win_chocolatey:
        name: nssm
        state: present

    - name: Download OWASP Juice Shop release
      ansible.windows.win_get_url:
        url: "https://github.com/juice-shop/juice-shop/releases/download/v{{ juice_shop_version }}/juice-shop-{{ juice_shop_version }}_node24_win32_x64.zip"
        dest: "{{ install_dir }}\\juice-shop.zip"
        force: false

    - name: Extract Juice Shop
      community.windows.win_unzip:
        src: "{{ install_dir }}\\juice-shop.zip"
        dest: "{{ install_dir }}"
        creates: "{{ install_dir }}\\juice-shop_{{ juice_shop_version }}"

    - name: Register Juice Shop as a Windows service via NSSM
      ansible.windows.win_shell: |
        $nodePath = (Get-Command node.exe -ErrorAction SilentlyContinue).Source
        if (-not $nodePath) { $nodePath = "C:\Program Files\nodejs\node.exe" }
        $appDir  = "{{ install_dir }}\juice-shop_{{ juice_shop_version }}"
        $status = nssm status JuiceShop 2>&1
        if ($status -notmatch "SERVICE_") {
          nssm install JuiceShop "$nodePath" "build/app"
        }
        nssm set JuiceShop Application "$nodePath"
        nssm set JuiceShop AppParameters "build/app"
        nssm set JuiceShop AppDirectory "$appDir"
        nssm set JuiceShop AppEnvironmentExtra "NODE_ENV=unsafe PORT={{ juice_shop_port }}"
        nssm set JuiceShop DisplayName "OWASP Juice Shop"
        nssm set JuiceShop Start SERVICE_AUTO_START
        nssm start JuiceShop 2>&1
        exit 0

    - name: Ensure Juice Shop service is running
      ansible.windows.win_shell: |
        $svc = Get-Service JuiceShop -ErrorAction SilentlyContinue
        if ($svc -and $svc.Status -ne "Running") {
          nssm start JuiceShop 2>&1 | Out-Null
          Start-Sleep 3
        }
        (Get-Service JuiceShop).Status
      ignore_errors: true

    - name: Download Wazuh Agent MSI
      ansible.windows.win_get_url:
        url: "https://packages.wazuh.com/4.x/windows/wazuh-agent-{{ wazuh_version }}-1.msi"
        dest: "{{ install_dir }}\\wazuh-agent-{{ wazuh_version }}-1.msi"
        force: false

    - name: Install Wazuh Agent
      ansible.windows.win_shell: |
        $msi = "{{ install_dir }}\wazuh-agent-{{ wazuh_version }}-1.msi"
        $args = @(
          "/i", $msi,
          "WAZUH_MANAGER={{ wazuh_manager_ip }}",
          "WAZUH_AGENT_NAME={{ agent_name }}",
          "WAZUH_REGISTRATION_SERVER={{ wazuh_manager_ip }}",
          "/quiet", "/norestart"
        )
        $p = Start-Process msiexec -ArgumentList $args -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
      args:
        creates: 'C:\Program Files (x86)\ossec-agent\wazuh-agent.exe'

    # Two fixes for DDoS flood testing throughput, both confirmed live (README.md
    # §5): the default logcollector.queue_size (1024) silently drops nginx
    # access-log lines under flood load ("Log lines may be lost"), and even
    # after fixing that, the agent's own client_buffer rate-limits outbound
    # events to a hard 1000 EPS max — once nginx/CPU can generate faster than
    # that (which the CPU_CORES bump in windows-dmz/docker-compose.yml enables),
    # the buffer itself becomes the bottleneck and starts dropping newest events
    # ("Agent buffer is flooded"). Disabling client_buffer removes that cap
    # entirely. Without both fixes, rule 100213 (needs 50 100210 hits/30s) can
    # never accumulate fast enough to fire on real flood traffic.
    - name: Increase logcollector queue size (default 1024 drops lines under DDoS flood load)
      ansible.windows.win_shell: |
        $conf = 'C:\Program Files (x86)\ossec-agent\local_internal_options.conf'
        if ((Get-Content $conf -Raw) -notmatch 'logcollector\.queue_size') {
          Add-Content -Path $conf -Value 'logcollector.queue_size=220000'
          Write-Output 'CHANGED'
        } else {
          Write-Output 'OK'
        }
      register: logcollector_queue_change
      changed_when: "'CHANGED' in logcollector_queue_change.stdout"

    - name: Disable the agent's client_buffer rate limiter (hard 1000 EPS cap becomes the bottleneck once nginx/CPU can generate faster)
      ansible.windows.win_shell: |
        $conf = 'C:\Program Files (x86)\ossec-agent\ossec.conf'
        $lines = Get-Content $conf
        $changed = $false
        for ($i = 0; $i -lt $lines.Count; $i++) {
          if ($lines[$i] -match '<client_buffer>' -and $lines[$i+1] -match '<disabled>no</disabled>') {
            $lines[$i+1] = $lines[$i+1] -replace '<disabled>no</disabled>', '<disabled>yes</disabled>'
            $changed = $true
            break
          }
        }
        if ($changed) {
          Set-Content -Path $conf -Value $lines
          Write-Output 'CHANGED'
        } else {
          Write-Output 'OK'
        }
      register: client_buffer_change
      changed_when: "'CHANGED' in client_buffer_change.stdout"

    - name: Start Wazuh Agent service
      ansible.windows.win_service:
        name: WazuhSvc
        state: started
        start_mode: auto

    - name: Restart Wazuh Agent service to apply queue/buffer config changes
      ansible.windows.win_service:
        name: WazuhSvc
        state: restarted
      when: logcollector_queue_change.changed or client_buffer_change.changed

    - name: Configure WazuhSvc auto-restart on failure
      ansible.windows.win_shell: >
        sc.exe failure WazuhSvc reset= 86400
        actions= restart/5000/restart/10000/restart/30000

    - name: Download Sysmon
      ansible.windows.win_get_url:
        url: "https://download.sysinternals.com/files/Sysmon.zip"
        dest: "{{ install_dir }}\\Sysmon.zip"
        force: false

    - name: Extract Sysmon
      community.windows.win_unzip:
        src: "{{ install_dir }}\\Sysmon.zip"
        dest: "{{ install_dir }}\\sysmon"
        creates: "{{ install_dir }}\\sysmon\\Sysmon64.exe"

    - name: Deploy Sysmon configuration (file-event focused)
      ansible.windows.win_copy:
        dest: "{{ install_dir }}\\sysmon\\sysmon-config.xml"
        content: |
          <Sysmon schemaversion="4.90">
            <EventFiltering>
              <!-- FileCreate/FileCreateStreamHash/FileDelete(Detected) with no
                   conditions below an onmatch="exclude" filter means nothing
                   gets excluded, i.e. log every event of that type. Only
                   Windows Update's own churn and Sysmon/Wazuh's own log
                   writes are filtered out to cut noise. -->
              <FileCreate onmatch="exclude">
                <TargetFilename condition="begin with">C:\Windows\SoftwareDistribution\</TargetFilename>
                <TargetFilename condition="contains">\ossec-agent\</TargetFilename>
                <TargetFilename condition="contains">\soc-infra\sysmon\</TargetFilename>
              </FileCreate>
              <FileCreateStreamHash onmatch="exclude" />
              <FileDelete onmatch="exclude" />
              <FileDeleteDetected onmatch="exclude" />
            </EventFiltering>
          </Sysmon>

    - name: Install or update Sysmon service with config
      ansible.windows.win_shell: |
        $svc = Get-Service Sysmon64 -ErrorAction SilentlyContinue
        if (-not $svc) {
          & '{{ install_dir }}\sysmon\Sysmon64.exe' -accepteula -i '{{ install_dir }}\sysmon\sysmon-config.xml'
        } else {
          & '{{ install_dir }}\sysmon\Sysmon64.exe' -c '{{ install_dir }}\sysmon\sysmon-config.xml'
        }
      register: sysmon_install
      changed_when: "'installed' in sysmon_install.stdout or 'updated' in sysmon_install.stdout"

    - name: Configure Wazuh agent to monitor Sysmon event log
      ansible.windows.win_shell: |
        $conf = 'C:\Program Files (x86)\ossec-agent\ossec.conf'
        $content = Get-Content $conf -Raw
        $block = "  <localfile>`n    <location>Microsoft-Windows-Sysmon/Operational</location>`n    <log_format>eventchannel</log_format>`n  </localfile>"
        if ($content -notmatch 'Sysmon/Operational') {
          $content = $content -replace '</ossec_config>', "$block`n</ossec_config>"
          Set-Content $conf $content
          Restart-Service WazuhSvc
          Write-Output 'ADDED'
        } else {
          Write-Output 'ALREADY_EXISTS'
        }
      register: wazuh_sysmon_conf_result
      changed_when: "'ADDED' in wazuh_sysmon_conf_result.stdout"

    - name: Allow Juice Shop inbound (port 3000)
      community.windows.win_firewall_rule:
        name: "Juice Shop HTTP"
        localport: "{{ juice_shop_port }}"
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    - name: Allow Wazuh agent outbound to manager
      community.windows.win_firewall_rule:
        name: "Wazuh Agent Outbound"
        remoteip: "{{ wazuh_manager_ip }}"
        remoteport: "1514,1515"
        action: allow
        direction: out
        protocol: tcp
        state: present
        enabled: true

    - name: Install nginx
      chocolatey.chocolatey.win_chocolatey:
        name: nginx
        state: present

    - name: Create nginx log directory
      ansible.windows.win_file:
        path: 'C:\nginx\logs'
        state: directory

    - name: Configure nginx as reverse proxy for Juice Shop
      ansible.windows.win_copy:
        dest: 'C:/tools/nginx-1.31.2/conf/nginx.conf'
        content: |
          worker_processes 1;
          events { worker_connections 1024; }
          http {
            include       mime.types;
            access_log    logs/access.log combined;
            error_log     logs/error.log warn;
            server {
              listen 80;
              location / {
                proxy_pass http://127.0.0.1:{{ juice_shop_port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
            }
          }

    - name: Install nginx as Windows service via NSSM
      ansible.windows.win_shell: |
        $status = nssm status nginx 2>&1
        if ($status -notmatch "SERVICE_") {
          nssm install nginx '{{ nginx_dir }}\nginx.exe'
          nssm set nginx AppDirectory '{{ nginx_dir }}'
        }
        nssm set nginx Start SERVICE_AUTO_START
        sc.exe stop nginx 2>$null
        Start-Sleep 1
        sc.exe start nginx
      ignore_errors: true

    - name: Allow nginx inbound (port 80)
      community.windows.win_firewall_rule:
        name: "nginx HTTP"
        localport: "80"
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true

    - name: Configure Wazuh agent to monitor nginx access log
      ansible.windows.win_shell: |
        $conf = 'C:\Program Files (x86)\ossec-agent\ossec.conf'
        $content = Get-Content $conf -Raw
        $block = "  <localfile>`n    <location>{{ nginx_dir }}\logs\access.log</location>`n    <log_format>apache</log_format>`n  </localfile>"
        if ($content -notmatch 'nginx.*access.log') {
          $content = $content -replace '</ossec_config>', "$block`n</ossec_config>"
          Set-Content $conf $content
          Restart-Service WazuhSvc
          Write-Output 'ADDED'
        } else {
          Write-Output 'ALREADY_EXISTS'
        }
      register: wazuh_conf_result

    - name: Wait for Juice Shop port to be listening
      ansible.windows.win_wait_for:
        port: "{{ juice_shop_port }}"
        timeout: 60
      ignore_errors: true

    - name: Check Wazuh service status
      ansible.windows.win_service:
        name: WazuhSvc
      register: wazuh_svc

    - name: Deployment summary
      debug:
        msg:
          - "================================================"
          - " Windows DMZ Deployment Complete"
          - "================================================"
          - " Juice Shop  -> http://{{ ansible_host }}:{{ juice_shop_port }} (direct)"
          - " nginx       -> http://{{ ansible_host }}:80 (reverse proxy)"
          - " Wazuh Agent -> {{ wazuh_svc.state }} (manager: {{ wazuh_manager_ip }})"
          - " nginx logs  -> Wazuh: {{ wazuh_conf_result.stdout | trim }}"
          - " Sysmon      -> Wazuh: {{ wazuh_sysmon_conf_result.stdout | trim }}"
          - "================================================"
