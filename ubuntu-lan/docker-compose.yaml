services:
  ubuntu:
    build: .
    image: ubuntu-lan:systemd
    container_name: lan
    restart: unless-stopped
    privileged: true
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - ./lan-workspace:/workspace
    working_dir: /workspace
    environment:
      - TZ=Asia/Taipei
