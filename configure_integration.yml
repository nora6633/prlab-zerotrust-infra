---
# Run AFTER site.yml once all services are up.
# Wires up: Wazuh alert → Shuffle webhook → DFIR-IRIS case creation.
#
# Prerequisites:
#   - group_vars/soc.yml: shuffle_default_apikey and iris_adm_api_key are set
#   - Wazuh, Shuffle, and DFIR-IRIS containers are running on the SOC host
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini configure_integration.yml

- name: Configure Wazuh → Shuffle → DFIR-IRIS integration
  hosts: soc
  become: true
  gather_facts: true

  tasks:
    # ── Shuffle: import workflow ──────────────────────────────────────────
    - name: Ensure Shuffle backend is reachable
      uri:
        url: "http://{{ wazuh_server_ip }}:5001/api/v1/health"
        method: GET
        status_code: 200
      register: shuffle_health
      until: shuffle_health.status == 200
      retries: 12
      delay: 5

    - name: Template Wazuh-to-IRIS workflow JSON onto host
      template:
        src: roles/shuffle/templates/wazuh_iris_workflow.json.j2
        dest: "{{ deploy_base_dir }}/shuffle/wazuh_iris_workflow.json"
        mode: '0644'

    - name: Import IRIS workflow into Shuffle via API (curl, avoids uri module bytes issue)
      shell: |
        curl -ks -o /tmp/iris_import.out -w "%{http_code}" -X POST \
          "http://{{ wazuh_server_ip }}:5001/api/v1/workflows" \
          -H "Authorization: Bearer {{ shuffle_default_apikey }}" \
          -H "Content-Type: application/json" \
          --data @{{ deploy_base_dir }}/shuffle/wazuh_iris_workflow.json
      register: iris_workflow_import
      changed_when: iris_workflow_import.stdout in ["200", "201"]
      failed_when: iris_workflow_import.stdout not in ["200", "201"]

    - name: Load Python scorer source for DDoS workflow N5
      set_fact:
        score_alert_code: "{{ lookup('file', 'roles/shuffle/files/ddos_score_alert.py') }}"

    - name: Template DDoS workflow JSON onto host (with embedded Python scorer)
      template:
        src: roles/shuffle/templates/wazuh_ddos_workflow.json.j2
        dest: "{{ deploy_base_dir }}/shuffle/wazuh_ddos_workflow.json"
        mode: '0644'

    - name: Import DDoS workflow into Shuffle via API (curl)
      shell: |
        curl -ks -o /tmp/ddos_import.out -w "%{http_code}" -X POST \
          "http://{{ wazuh_server_ip }}:5001/api/v1/workflows" \
          -H "Authorization: Bearer {{ shuffle_default_apikey }}" \
          -H "Content-Type: application/json" \
          --data @{{ deploy_base_dir }}/shuffle/wazuh_ddos_workflow.json
      register: ddos_workflow_import
      changed_when: ddos_workflow_import.stdout in ["200", "201"]
      failed_when: ddos_workflow_import.stdout not in ["200", "201"]

    - name: Show DDoS import response
      shell: cat /tmp/ddos_import.out
      register: ddos_import_resp
      changed_when: false

    - debug:
        msg: "{{ ddos_import_resp.stdout | truncate(200) }}"

    - name: Load Python scorer source for USB-DLP workflow
      set_fact:
        usb_dlp_score_alert_code: "{{ lookup('file', 'roles/shuffle/files/usb_dlp_score_alert.py') }}"

    - name: Template USB-DLP workflow JSON onto host (with embedded Python scorer)
      template:
        src: roles/shuffle/templates/wazuh_usb_dlp_workflow.json.j2
        dest: "{{ deploy_base_dir }}/shuffle/wazuh_usb_dlp_workflow.json"
        mode: '0644'

    - name: Import USB-DLP workflow into Shuffle via API (curl)
      shell: |
        curl -ks -o /tmp/usb_dlp_import.out -w "%{http_code}" -X POST \
          "http://{{ wazuh_server_ip }}:5001/api/v1/workflows" \
          -H "Authorization: Bearer {{ shuffle_default_apikey }}" \
          -H "Content-Type: application/json" \
          --data @{{ deploy_base_dir }}/shuffle/wazuh_usb_dlp_workflow.json
      register: usb_dlp_workflow_import
      changed_when: usb_dlp_workflow_import.stdout in ["200", "201"]
      failed_when: usb_dlp_workflow_import.stdout not in ["200", "201"]

    - name: Show USB-DLP import response
      shell: cat /tmp/usb_dlp_import.out
      register: usb_dlp_import_resp
      changed_when: false

    - debug:
        msg: "{{ usb_dlp_import_resp.stdout | truncate(200) }}"

    # ── Wazuh: install custom integration ────────────────────────────────
    # ── Capture Shuffle-assigned trigger IDs (Shuffle re-generates UUIDs on import) ──
    - name: Query Shuffle for actual webhook trigger IDs
      shell: |
        curl -ks -H "Authorization: Bearer {{ shuffle_default_apikey }}" \
          "http://{{ wazuh_server_ip }}:5001/api/v1/workflows"
      register: shuffle_workflows_raw
      changed_when: false

    - name: Parse trigger IDs from Shuffle workflows
      set_fact:
        shuffle_iris_actual_trig: "{{ (shuffle_workflows_raw.stdout | from_json | selectattr('name', 'equalto', 'Wazuh Alert to DFIR-IRIS Case') | first).triggers[0].id }}"
        shuffle_ddos_actual_trig: "{{ (shuffle_workflows_raw.stdout | from_json | selectattr('name', 'equalto', 'Wazuh DDoS Auto-Response') | first).triggers[0].id }}"
        shuffle_usb_dlp_actual_trig: "{{ (shuffle_workflows_raw.stdout | from_json | selectattr('name', 'equalto', 'Wazuh USB-DLP Auto-Response') | first).triggers[0].id }}"

    - name: Show captured trigger IDs
      debug:
        msg:
          - "IRIS webhook trigger: {{ shuffle_iris_actual_trig }}"
          - "DDoS webhook trigger: {{ shuffle_ddos_actual_trig }}"
          - "USB-DLP webhook trigger: {{ shuffle_usb_dlp_actual_trig }}"

    # "start" here is load-bearing, not cosmetic: Shuffle stores each webhook
    # trigger as its own document in a separate OpenSearch "hooks" index, and
    # the webhook dispatcher reads THAT document's own "start" field to know
    # which action to run first - not the workflow's own "start" field, and
    # not the trigger's "isStartNode" flag on the workflow object. Omitting
    # it here leaves the hook's "start" empty, and every webhook call then
    # fails with "No start node for hook ... running with workflow default"
    # (confirmed live: last_node empty, zero results, execution stuck in
    # EXECUTING forever) - detection still fires correctly and custom-shuffle
    # forwards successfully, but the workflow DAG silently never runs.
    - name: Activate all webhook hooks (idempotent)
      shell: |
        curl -ks -X POST -H "Authorization: Bearer {{ shuffle_default_apikey }}" \
          -H "Content-Type: application/json" \
          -d '{"id":"{{ item.trig }}","name":"{{ item.name }}","info":{"name":"{{ item.name }}"},"type":"webhook","workflows":["{{ item.wf }}"],"status":"running","workflow":"{{ item.wf }}","start":"{{ item.start }}"}' \
          "http://{{ wazuh_server_ip }}:5001/api/v1/hooks/new"
      loop:
        - { trig: "{{ shuffle_iris_actual_trig }}", wf: "{{ (shuffle_workflows_raw.stdout | from_json | selectattr('name', 'equalto', 'Wazuh Alert to DFIR-IRIS Case') | first).id }}", name: "Wazuh Webhook", start: "iris-create-case" }
        - { trig: "{{ shuffle_ddos_actual_trig }}", wf: "{{ (shuffle_workflows_raw.stdout | from_json | selectattr('name', 'equalto', 'Wazuh DDoS Auto-Response') | first).id }}", name: "DDoS Webhook", start: "dedupe_check" }
        - { trig: "{{ shuffle_usb_dlp_actual_trig }}", wf: "{{ (shuffle_workflows_raw.stdout | from_json | selectattr('name', 'equalto', 'Wazuh USB-DLP Auto-Response') | first).id }}", name: "USB DLP Webhook", start: "history_check" }
      changed_when: false

    - name: Template custom-shuffle integration script (with actual trigger IDs)
      template:
        src: roles/wazuh_server/templates/custom-shuffle.py.j2
        dest: /tmp/custom-shuffle
        mode: '0755'
      vars:
        shuffle_webhook_trigger_id: "{{ shuffle_iris_actual_trig }}"
        shuffle_ddos_webhook_trigger_id: "{{ shuffle_ddos_actual_trig }}"
        shuffle_usb_dlp_webhook_trigger_id: "{{ shuffle_usb_dlp_actual_trig }}"

    - name: Copy integration script into single-node-wazuh.manager-1 container
      command: docker cp /tmp/custom-shuffle single-node-wazuh.manager-1:/var/ossec/integrations/custom-shuffle

    - name: Set ownership and permissions on integration script
      command: >
        docker exec single-node-wazuh.manager-1 sh -c
        "chown root:wazuh /var/ossec/integrations/custom-shuffle &&
         chmod 750 /var/ossec/integrations/custom-shuffle"

    - name: Template ossec.conf injection script
      template:
        src: roles/wazuh_server/templates/inject_integration.py.j2
        dest: /tmp/inject_integration.py
        mode: '0755'

    - name: Inject Shuffle integration block into host-side wazuh_manager.conf
      command: python3 /tmp/inject_integration.py
      register: inject_result

    - name: Show injection result
      debug:
        msg: "{{ inject_result.stdout }}"

    - name: Restart single-node-wazuh.manager-1 to apply integration config
      command: docker restart single-node-wazuh.manager-1

    # ── Summary ───────────────────────────────────────────────────────────
    - name: Print integration summary
      debug:
        msg:
          - "Integration configured successfully!"
          - ""
          - "Data flow:"
          - "  Wazuh alert (level >= {{ wazuh_alert_min_level }})"
          - "    → Shuffle webhook: http://{{ wazuh_server_ip }}:5001/api/v1/hooks/{{ shuffle_webhook_trigger_id }}"
          - "    → DFIR-IRIS case:  https://{{ wazuh_server_ip }}:4444"
          - ""
          - "Service endpoints:"
          - "  Wazuh dashboard : https://{{ wazuh_server_ip }}"
          - "  Shuffle UI      : http://{{ wazuh_server_ip }}:3001"
          - "  DFIR-IRIS       : https://{{ wazuh_server_ip }}:4444"
          - "  Juice Shop      : http://{{ external_host_ip }}:3000"
          - "  Nextcloud       : http://{{ lan_host_ip }}:8888"
          - "  FreeIPA         : https://{{ lan_host_ip }}:8443"
          - "  Mailcow         : https://{{ lan_host_ip }}"
