---
# insider_threat_accounts moved to group_vars/all.yml - configure_insider_threat_integration.yml
# (a separate play, no role defaults in scope) also needs it to build
# UID_MAP/WHITELIST for the Shuffle scorer, so it can't live in this role's
# own defaults/ anymore.

insider_threat_ssh_key_path: "{{ playbook_dir }}/secrets/insider_threat_test_key"

insider_threat_isolate_timeout_seconds: 120

# Whitelist for host-isolate.sh. 172.23.0.1 is the dmz-ubuntu_default
# bridge gateway - confirmed via `docker network inspect` that this is the
# SAME address the Docker host uses whether connecting in via Ansible or a
# manual `docker exec`/`ssh` from the host (dmz-ubuntu does not publish
# port 22 externally, so there is no separate "your laptop's IP" to
# whitelist - everything reaching this container's sshd arrives from the
# host's bridge-side address).
insider_threat_mgmt_ip: 172.23.0.1
